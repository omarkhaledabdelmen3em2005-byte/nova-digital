<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — Plinth</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="page-head wrap">
  <div class="breadcrumb"><a href="index.html">Home</a> / <span>Wishlist</span></div>
  <h1 class="display-2">Your Wishlist</h1>
  <p style="margin-top:8px;">Products you've saved for later.</p>
</div>

<section class="wrap" style="padding-top:8px;">
  <div class="grid grid-4" id="wish-grid"></div>
  <div class="empty-state" id="wish-empty" style="display:none;">
    <div class="ico" id="wish-empty-ico"></div>
    <h3 class="display-3">Nothing saved yet</h3>
    <p style="margin:10px 0 20px;">Tap the heart on any product to save it here.</p>
    <a href="store.html" class="btn btn-primary">Browse Products</a>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader();
  renderFooter();
  document.getElementById('wish-empty-ico').innerHTML = ICON.heart;

  function render(){
    const ids = Wishlist.items();
    const grid = document.getElementById('wish-grid');
    const empty = document.getElementById('wish-empty');
    if(!ids.length){ grid.style.display='none'; empty.style.display='block'; return; }
    grid.style.display='grid'; empty.style.display='none';
    grid.innerHTML = ids.map(id => productCard(getProduct(id))).filter(Boolean).join('');
    bindCardEvents(grid);
  }
  document.addEventListener('wishlist:change', render);
  render();
</script>
</body>
</html>
