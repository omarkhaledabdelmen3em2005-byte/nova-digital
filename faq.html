<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — Plinth</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="page-head wrap">
  <div class="breadcrumb"><a href="index.html">Home</a> / <span>FAQ</span></div>
  <h1 class="display-2">Frequently Asked Questions</h1>
</div>

<section class="wrap" style="padding-top:8px;max-width:820px;">
  <div id="faq-root"></div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader('FAQ');
  renderFooter();

  const FAQ = {
    payments: { label:'Payments', items:[
      ["What payment methods do you accept?","Card, Apple Pay and PayPal, processed through an encrypted checkout."],
      ["Is my payment information stored?","No — full card details are handled by the payment processor, never stored on our servers."],
      ["Will I get a receipt?","Yes, an email receipt is sent immediately after purchase."],
    ]},
    downloads: { label:'Downloads', items:[
      ["How do I download my product?","From the Order Success page right after checkout, or anytime from My Account → Downloads."],
      ["Do download links expire?","No — access is permanent for as long as your account exists."],
      ["Can I download on multiple devices?","Yes, there's no device limit for your own use."],
    ]},
    refunds: { label:'Refunds', items:[
      ["What's your refund policy?","Refund requests are accepted within 14 days if the product hasn't been substantially used, at our discretion."],
      ["How do I request a refund?","Open a support ticket from My Account → Support with your order number."],
      ["How long do refunds take?","Approved refunds are returned to your original payment method within 5–10 business days."],
    ]},
    licensing: { label:'Licensing', items:[
      ["Can I use products commercially?","Most products include a commercial license — check the License tab on each product page."],
      ["Can I resell a template as my own?","No — reselling or redistributing the raw files themselves isn't permitted under any license tier."],
      ["Do I need to give credit?","No attribution is required for personal or commercial use within license terms."],
    ]},
    technical: { label:'Technical', items:[
      ["What software do I need?","Listed per product on its page — most use Canva, Notion, Figma or standard file formats like PDF."],
      ["My file won't open — what do I do?","Contact support with your order number and the file name; we'll help directly."],
      ["Do you provide product updates?","Where noted on the product page, updates are included at no extra cost."],
    ]},
  };

  document.getElementById('faq-root').innerHTML = Object.entries(FAQ).map(([key, cat]) => `
    <div class="faq-cat reveal in" id="${key}">
      <h3>${cat.label}</h3>
      ${cat.items.map((f,i) => `
        <div class="accordion-item">
          <div class="accordion-head">${f[0]}<span>${ICON.plus}</span></div>
          <div class="accordion-body"><p>${f[1]}</p></div>
        </div>`).join('')}
    </div>`).join('');

  document.addEventListener('click', (e) => { const h = e.target.closest('.accordion-head'); if(h) h.parentElement.classList.toggle('open'); });

  if(location.hash){ const el = document.querySelector(location.hash); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth', block:'start'}), 100); }
</script>
</body>
</html>
