<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Plinth</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="page-head wrap">
  <div class="breadcrumb"><a href="index.html">Home</a> / <span>Cart</span></div>
  <h1 class="display-2">Your Cart</h1>
</div>

<section class="wrap" style="padding-top:8px;" id="cart-section">
  <div class="cart-layout" id="cart-layout">
    <div>
      <div id="cart-items"></div>
      <div id="saved-later" style="margin-top:32px;"></div>
    </div>
    <div class="summary-card">
      <h3 style="font-size:16px;margin-bottom:16px;">Order Summary</h3>
      <div class="coupon-row">
        <input type="text" id="coupon-input" placeholder="Coupon code">
        <button class="btn btn-outline btn-sm" id="apply-coupon">Apply</button>
      </div>
      <div id="coupon-msg" style="font-size:12.5px;color:var(--verdigris);margin-bottom:6px;"></div>
      <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">$0</span></div>
      <div class="summary-row" id="sum-discount-row" style="display:none;"><span>Discount</span><span id="sum-discount">-$0</span></div>
      <div class="summary-row total"><span>Total</span><span id="sum-total">$0</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:18px;" id="checkout-btn">Checkout</a>
      <p style="font-size:12px;color:var(--stone);margin-top:12px;text-align:center;">Secure checkout · Instant delivery on payment</p>
    </div>
  </div>

  <div class="empty-state" id="empty-cart" style="display:none;">
    <div class="ico"></div>
    <h3 class="display-3">Your cart is empty</h3>
    <p style="margin:10px 0 20px;">Browse the store to find your next product.</p>
    <a href="store.html" class="btn btn-primary">Explore Products</a>
  </div>
</section>

<section class="wrap mt-lg">
  <div class="section-head reveal"><div><div class="eyebrow">Pairs well</div><h2 class="display-3">Frequently Bought Together</h2></div></div>
  <div class="grid grid-4" id="fbt-grid"></div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader('Store');
  renderFooter();
  document.querySelector('#empty-cart .ico').innerHTML = ICON.cart;

  let coupon = Store.get('plinth_coupon', null);

  function render(){
    const items = Cart.items();
    const layout = document.getElementById('cart-layout');
    const empty = document.getElementById('empty-cart');
    if(!items.length){ layout.style.display='none'; empty.style.display='block'; renderFBT(); return; }
    layout.style.display='grid'; empty.style.display='none';

    document.getElementById('cart-items').innerHTML = items.map(it => {
      const p = getProduct(it.id); if(!p) return '';
      return `<div class="cart-row" data-row="${p.id}">
        <div class="cart-thumb" style="background:linear-gradient(135deg, ${p.palette[0]}44, ${p.palette[1]}44);"></div>
        <div>
          <a href="product.html?slug=${p.slug}" style="font-weight:600;font-size:15px;">${p.name}</a>
          <div style="font-size:12.5px;color:var(--stone);margin-top:4px;">${getCategory(p.category)?.name}</div>
          <div class="cart-actions-row">
            <button data-remove="${p.id}">Remove</button>
            <button data-save="${p.id}">Save for later</button>
          </div>
        </div>
        <div class="cart-qty">
          <button data-dec="${p.id}">−</button><span>${it.qty}</span><button data-inc="${p.id}">+</button>
        </div>
        <div class="price">$${(p.price*it.qty).toFixed(0)}</div>
      </div>`;
    }).join('');

    const saved = Store.get('plinth_saved', []);
    document.getElementById('saved-later').innerHTML = saved.length ? `
      <h3 style="font-size:15px;margin-bottom:14px;">Saved for later</h3>
      ${saved.map(id => { const p = getProduct(id); if(!p) return ''; return `
        <div class="cart-row" style="grid-template-columns:84px 1fr auto;">
          <div class="cart-thumb" style="background:linear-gradient(135deg, ${p.palette[0]}44, ${p.palette[1]}44);"></div>
          <div><a href="product.html?slug=${p.slug}" style="font-weight:600;font-size:15px;">${p.name}</a>
            <div style="font-size:12.5px;color:var(--stone);margin-top:4px;">$${p.price}</div></div>
          <button class="btn btn-outline btn-sm" data-restore="${p.id}">Move to Cart</button>
        </div>`;}).join('')}` : '';

    bindRowEvents();
    updateSummary();
  }

  function bindRowEvents(){
    document.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
      const id = Number(b.dataset.inc); const it = Cart.items().find(i=>i.id===id); Cart.setQty(id, it.qty+1); render();
    }));
    document.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
      const id = Number(b.dataset.dec); const it = Cart.items().find(i=>i.id===id);
      if(it.qty<=1){ Cart.remove(id); toast('Removed from cart'); } else Cart.setQty(id, it.qty-1);
      render();
    }));
    document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => { Cart.remove(Number(b.dataset.remove)); toast('Removed from cart'); render(); }));
    document.querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', () => {
      const id = Number(b.dataset.save); let saved = Store.get('plinth_saved', []);
      if(!saved.includes(id)) saved.push(id); Store.set('plinth_saved', saved); Cart.remove(id); toast('Saved for later'); render();
    }));
    document.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', () => {
      const id = Number(b.dataset.restore); let saved = Store.get('plinth_saved', []).filter(x=>x!==id);
      Store.set('plinth_saved', saved); Cart.add(id,1); toast('Moved to cart'); render();
    }));
  }

  function updateSummary(){
    const subtotal = Cart.subtotal();
    let discount = 0;
    if(coupon === 'PLINTH10') discount = subtotal * 0.10;
    document.getElementById('sum-subtotal').textContent = '$' + subtotal.toFixed(0);
    document.getElementById('sum-discount-row').style.display = discount ? 'flex' : 'none';
    document.getElementById('sum-discount').textContent = '-$' + discount.toFixed(0);
    document.getElementById('sum-total').textContent = '$' + (subtotal - discount).toFixed(0);
    Store.set('plinth_coupon', coupon);
  }

  document.getElementById('apply-coupon').addEventListener('click', () => {
    const val = document.getElementById('coupon-input').value.trim().toUpperCase();
    const msg = document.getElementById('coupon-msg');
    if(val === 'PLINTH10'){ coupon = val; msg.textContent = 'Coupon applied — 10% off.'; toast('Coupon applied'); }
    else { coupon = null; msg.textContent = 'Invalid or expired code.'; msg.style.color = 'var(--danger)'; }
    updateSummary();
  });

  function renderFBT(){
    document.getElementById('fbt-grid').innerHTML = PRODUCTS.slice(0,4).map(productCard).join('');
    bindCardEvents(document.getElementById('fbt-grid'));
  }

  document.addEventListener('cart:change', render);
  render();
  renderFBT();
</script>
</body>
</html>
